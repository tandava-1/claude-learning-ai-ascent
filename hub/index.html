<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Ascent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F6F5F0; --surface:#FFFFFF; --surface-2:#EFEDE6; --ink:#16202B; --ink-2:#5A6572; --ink-3:#8A93A0; --rule:#DAD8CF; --rule-2:#E8E6DE;
  --accent:#0E5A8A; --accent-ink:#FFFFFF; --accent-soft:#E3EEF6; --warm:#C2591B; --warm-soft:#F8E8DC;
  --k:#0E5A8A; --k-soft:#E3EEF6; --r:#3C7A48; --r-soft:#E4F0E5; --x:#8A3568; --x-soft:#F3E3EC;
  --good:#2E7D4F; --warn:#B7791F; --bad:#B23A3A;
  --shadow:0 1px 2px rgba(22,32,43,.06), 0 8px 24px -12px rgba(22,32,43,.18);
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1218; --surface:#161B23; --surface-2:#1C222C; --ink:#E7E8E3; --ink-2:#A1A8B3; --ink-3:#6F7885; --rule:#29303B; --rule-2:#222933;
    --accent:#74B7E9; --accent-ink:#0B1520; --accent-soft:#16283A; --warm:#EC9A5C; --warm-soft:#33241A;
    --k:#74B7E9; --k-soft:#16283A; --r:#86C495; --r-soft:#182A1E; --x:#D48FBD; --x-soft:#2E1A28;
    --good:#6CC08B; --warn:#E0B25A; --bad:#E07A7A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1218; --surface:#161B23; --surface-2:#1C222C; --ink:#E7E8E3; --ink-2:#A1A8B3; --ink-3:#6F7885; --rule:#29303B; --rule-2:#222933;
  --accent:#74B7E9; --accent-ink:#0B1520; --accent-soft:#16283A; --warm:#EC9A5C; --warm-soft:#33241A;
  --k:#74B7E9; --k-soft:#16283A; --r:#86C495; --r-soft:#182A1E; --x:#D48FBD; --x-soft:#2E1A28;
  --good:#6CC08B; --warn:#E0B25A; --bad:#E07A7A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:clamp(16px,3vw,32px);padding-block:0 64px}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(22px,2.4vw,28px);font-weight:700;letter-spacing:-.01em}
h3{font-size:19px;font-weight:700}
h4{font-size:17px;font-weight:700}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:14.5px}
.num{font-variant-numeric:tabular-nums}
p{margin:0 0 1em}
.prose{max-width:68ch}
.prose p{margin:0 0 1.05em}
.prose ul,.prose ol{padding-left:1.4em;margin:0 0 1.05em}
.prose li{margin:.25em 0}
.prose h5{font-family:var(--display);font-size:16px;margin:1.2em 0 .4em}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.05em .35em;border-radius:3px}
.prose strong{font-weight:600}
/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:22px 14px;border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .name{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1}
.brand .sub{color:var(--ink-2);font-size:15px}
.meter{display:flex;flex-direction:column;gap:6px;min-width:min(340px,100%)}
.meter .row{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--k),var(--warm));width:0%;transition:width .5s ease}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--rule);scrollbar-width:none;position:sticky;top:0;background:var(--paper);z-index:5}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2);text-decoration:none;padding:8px 12px;border-radius:6px;white-space:nowrap}
nav.tabs a:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav.tabs .spacer{flex:1}
nav.tabs .status{align-self:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap;padding-right:6px}
main{padding-block:26px}
/* generic components */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.card.raised{box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.grid > *{min-width:0}
.col{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);min-width:0}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);background:var(--surface)}
.chip.k{border-color:transparent;background:var(--k-soft);color:var(--k)}
.chip.r{border-color:transparent;background:var(--r-soft);color:var(--r)}
.chip.x{border-color:transparent;background:var(--x-soft);color:var(--x)}
.chip.warm{border-color:transparent;background:var(--warm-soft);color:var(--warm)}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:14.5px;padding:8px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{font-size:13px;padding:5px 10px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.done{background:var(--r-soft);border-color:transparent;color:var(--r)}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical;font-family:var(--body)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink-2);font-family:var(--display)}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--rule-2);cursor:pointer}
.check:first-child{border-top:0}
.check input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.check.on span{color:var(--ink-3);text-decoration:line-through}
.empty{padding:28px 20px;border:1px dashed var(--rule);border-radius:10px;color:var(--ink-2);text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--display);font-size:14px;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.toast.show{opacity:1}
/* today */
.today-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:18px}
.daycount{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,54px);letter-spacing:-.02em;line-height:1}
.daycount small{font-size:.42em;font-weight:600;color:var(--ink-2);letter-spacing:0}
.unit{border-left:4px solid var(--warm);padding-left:16px}
.streak{display:flex;gap:4px;margin-top:8px}
.streak i{width:14px;height:14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--rule)}
.streak i.on{background:var(--warm);border-color:var(--warm)}
.streak i.today{outline:2px solid var(--ink);outline-offset:1px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week > div{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px;font-size:13px;min-width:0}
.week > div.now{border-color:var(--warm);background:var(--warm-soft)}
.week .d{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.06em}
.week .u{font-family:var(--display);font-weight:600;font-size:13px;margin-top:2px;line-height:1.2}
.week .h{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:2px}
@media (max-width:640px){.week{grid-template-columns:repeat(4,1fr)}}
/* curriculum layout */
.curr{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.curr{grid-template-columns:minmax(0,1fr)}}
.curr > article{min-width:0}
.rail{position:sticky;top:56px;max-height:calc(100vh - 72px);overflow:auto;padding-right:6px}
@media (max-width:900px){.rail{position:static;max-height:none;display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}}
.rail a{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;padding:8px 8px;border-radius:8px;text-decoration:none;color:var(--ink);border-left:2px solid transparent}
@media (max-width:900px){.rail a{grid-template-columns:1fr;min-width:170px;border-left:0;border:1px solid var(--rule);background:var(--surface)}}
.rail a:hover{background:var(--surface-2)}
.rail a.on{background:var(--surface);border-left-color:var(--warm);box-shadow:var(--shadow)}
@media (max-width:900px){.rail a.on{border-color:var(--warm)}}
.rail .alt{font-family:var(--mono);font-size:12px;color:var(--ink-2);padding-top:3px}
.rail .t{font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.25}
.rail .w{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;align-items:center}
.dots{display:inline-flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--r)}
.mod-head{padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.mod-head .kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.mod-head .tag{font-size:19px;color:var(--ink-2);font-style:italic;max-width:68ch;margin-top:8px}
.hours{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.hours b{color:var(--ink);font-weight:500}
.sect{padding-block:26px;border-bottom:1px solid var(--rule-2)}
.sect:last-child{border-bottom:0}
.sect > .eyebrow{margin-bottom:6px}
.sect h2{margin-bottom:12px}
.sect.r h2, .sect.r .eyebrow{color:var(--r)}
.sect.x h2, .sect.x .eyebrow{color:var(--x)}
.sect.r .eyebrow,.sect.x .eyebrow{opacity:.9}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.subnav a{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-2);text-decoration:none;padding:4px 9px;border:1px solid var(--rule);border-radius:999px;background:var(--surface)}
.subnav a:hover{color:var(--ink);border-color:var(--ink-3)}
.timeline{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-width:76ch}
.timeline li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;align-items:baseline}
.timeline .y{font-family:var(--mono);font-size:13px;color:var(--warm);font-weight:500}
.readings{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.readings li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.readings .kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);margin-top:3px;min-width:58px;text-align:center}
.readings .t{font-family:var(--display);font-weight:600;font-size:15.5px}
.readings .by{font-size:14px;color:var(--ink-2)}
.readings .note{font-size:14.5px;margin-top:3px}
.readings .time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px;max-width:76ch}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;font-size:15px;width:28px;height:28px;border-radius:50%;background:var(--k-soft);color:var(--k);display:flex;align-items:center;justify-content:center;margin-top:1px}
.callout{border:1px solid var(--rule);border-left:4px solid var(--warm);background:var(--surface);border-radius:8px;padding:12px 16px;margin:14px 0;max-width:76ch}
.callout .eyebrow{margin-bottom:4px}
.callout.purpose{border-left-color:var(--warm);background:var(--warm-soft);font-size:16.5px;max-width:76ch;margin:16px 0 4px}
.primer{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--rule-2)}
.primer .pn{font-family:var(--display);font-weight:800;font-size:18px;color:var(--warm)}
.primer .ex{padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.callout.plain{border-left-color:var(--k);background:var(--k-soft);font-size:16.5px;max-width:76ch}
.example{border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:16px 18px;margin-bottom:14px;max-width:80ch}
.example h3{margin:2px 0 10px}
.example .setup{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:15.5px;margin-bottom:10px}
.example .setup .eyebrow,.example .what-changed .eyebrow{display:block;margin-bottom:3px}
.exsteps{padding-left:1.4em;margin:0 0 10px;font-size:15.5px;font-variant-numeric:tabular-nums}
.exsteps li{margin:.35em 0}
.example .what-changed{padding:10px 12px;border-radius:8px;background:var(--warm-soft);font-size:15.5px}
.tbl-wrap{overflow-x:auto;margin:6px 0 12px}
.tbl{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;min-width:320px}
.tbl th,.tbl td{border:1px solid var(--rule);padding:5px 9px;text-align:left;white-space:nowrap}
.tbl th{background:var(--surface-2);font-weight:500;color:var(--ink-2)}
.puzzle{border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:14px 16px;margin-bottom:12px;max-width:80ch}
.puzzle .q{font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:8px}
.puzzle .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.puzzle .hint,.puzzle .ans{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:15.5px}
.puzzle .hint{background:var(--surface-2)}
.puzzle .ans{background:var(--k-soft)}
.puzzle .check{border:0;padding:0;display:block;margin-top:10px;cursor:default}
.puzzle .verdict{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--r-soft);font-size:15px;white-space:pre-wrap}
.puzzle .thread{margin-top:2px}
.puzzle .mine{margin-top:8px;margin-left:auto;max-width:90%;padding:8px 12px;border-radius:8px;background:var(--surface-2);font-size:15px;white-space:pre-wrap}
.puzzle .followup{margin-top:10px}
.puzzle .followup .eyebrow{display:block;margin-bottom:4px}
.forecast{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);margin-bottom:10px;max-width:80ch}
.forecast .q{font-size:15.5px}
.forecast .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:4px;display:flex;flex-wrap:wrap;gap:10px}
.forecast .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.forecast .ctl input[type=number]{width:74px;padding:6px 8px;font-family:var(--mono)}
.forecast .p{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.forecast .res{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:999px}
.forecast .res.yes{background:var(--r-soft);color:var(--r)}
.forecast .res.no{background:var(--warm-soft);color:var(--warm)}
.forecast .res.open{background:var(--surface-2);color:var(--ink-2)}
@media (max-width:560px){.forecast{grid-template-columns:1fr}.forecast .ctl{justify-content:flex-start}}
.people{list-style:none;padding:0;margin:0;display:grid;gap:6px;max-width:76ch}
.people li{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr);gap:10px;font-size:15px}
.people b{font-family:var(--display);font-weight:600}
.applied{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-width:76ch}
.applied li{padding-left:14px;border-left:2px solid var(--r-soft)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1}
.stat .l{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.digest{border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:16px 20px;margin-bottom:14px}
.digest summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.digest summary::-webkit-details-marker{display:none}
.digest summary .t{font-family:var(--display);font-weight:700;font-size:18px}
.digest summary .sum{flex-basis:100%;color:var(--ink-2);font-size:15px}
.digest .body{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule-2)}
.digest .body h3,.digest .body h4{margin:1.1em 0 .4em}
.digest .src{font-size:13.5px;color:var(--ink-2);margin-top:12px}
.sample-out{margin-top:10px;padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:15.5px;white-space:pre-wrap;max-width:76ch}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:15px;max-width:76ch}
.kv dt{font-family:var(--mono);font-size:12px;color:var(--ink-2);padding-top:3px}
.kv dd{margin:0}
.ritual{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--rule-2)}
.ritual:first-child{border-top:0}
.ritual b{font-family:var(--display);font-weight:700;white-space:nowrap}
pre.code{max-width:100%;font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.selbtn{position:absolute;z-index:30;font-family:var(--display);font-weight:600;font-size:13px;padding:6px 11px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);cursor:pointer}

input[type=range]{width:100%;accent-color:var(--accent)}

<script src="curriculum.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const main = $('#main');
  const LS_KEY = 'ai-ascent-state-v3'; // v3: progress reset on the product-builder re-plan

  // ───────────────────────── utilities
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+?)\*(?=[^*\w]|$)/g, '$1<em>$2</em>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  function md(src) {
    if (!src) return '';
    const blocks = String(src).replace(/\r/g, '').trim().split(/\n\s*\n/);
    return blocks.map(b => {
      const lines = b.split('\n').filter(l => l.trim() !== '');
      if (!lines.length) return '';
      if (lines.every(l => /^\s*[-•*] /.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-•*] /, '')) + '</li>').join('') + '</ul>';
      if (lines.every(l => /^\s*\d+[.)] /.test(l))) return '<ol>' + lines.map(l => '<li>' + inline(l.replace(/^\s*\d+[.)] /, '')) + '</li>').join('') + '</ol>';
      const h = lines[0].match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        const lvl = Math.min(h[1].length + 2, 5);
        const rest = lines.slice(1);
        return `<h${lvl}>${inline(h[2])}</h${lvl}>` + (rest.length ? '<p>' + rest.map(inline).join('<br>') + '</p>' : '');
      }
      return '<p>' + lines.map(inline).join('<br>') + '</p>';
    }).join('');
  }
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const fmt = d => `${MONTHS[d.getMonth()]} ${d.getDate()}`;
  const fmtLong = d => `${DOW[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  const daysBetween = (a, b) => Math.round((b - a) / 86400000);
  const uid = () => 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

  // ───────────────────────── state
  const state = {
    db: null, sample: null, synced: false,
    progress: { items: {}, days: {}, tasks2: {} },
    forecasts: {}, digests: {}, notes: {}, highlights: {}, bookmarks: {}, settings: { start: PLAN.start }
  };
  function loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) { const s = JSON.parse(raw); Object.assign(state.progress, s.progress || {}); state.progress.items = state.progress.items || {}; state.progress.days = state.progress.days || {}; state.progress.tasks2 = state.progress.tasks2 || {}; state.forecasts = s.forecasts || {}; state.notes = s.notes || {}; state.settings = Object.assign({ start: PLAN.start }, s.settings || {}); state.digests = s.digests || {}; state.highlights = s.highlights || {}; state.bookmarks = s.bookmarks || {}; } } catch (e) { }
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ progress: state.progress, forecasts: state.forecasts, notes: state.notes, settings: state.settings, digests: state.digests, highlights: state.highlights, bookmarks: state.bookmarks })); } catch (e) { }
  }
  function setStatus(t) { $('#sync-status').textContent = t; }

  // ───────────────────────── derived
  const start = () => parse(state.settings.start || PLAN.start);
  // Module dates come from hours, not calendar weeks: each module takes its own hours (all ~20 h) out of the
  // weekday template (Mon-Fri 1.5 h, Sat-Sun 3 h), so the dates stay true if the template or start date changes.
  const modHours = m => Object.values(m.hours).reduce((a, b) => a + b, 0);
  let _sched = null, _schedKey = '';
  function schedule() {
    const key = (state.settings.start || PLAN.start) + '|' + PLAN.weekTemplate.map(u => u.hours).join(',');
    if (_sched && _schedKey === key) return _sched;
    let d = start(), cum = 0, target = 0, prevEnd = null; const out = [];
    for (const m of PLAN.modules) {
      target += modHours(m); const first = prevEnd ? addDays(prevEnd, 1) : start(); let last = d;
      while (cum < target - 1e-9) { cum += PLAN.weekTemplate[(d.getDay() + 6) % 7].hours; last = d; d = addDays(d, 1); }
      out.push({ n: m.n, start: first, end: last }); prevEnd = last;
    }
    _sched = out; _schedKey = key; return out;
  }
  const modSpan = n => schedule().find(x => x.n === n);
  const modRange = n => { const x = modSpan(n); return `${fmt(x.start)} – ${fmt(x.end)}`; };
  const summitDate = () => schedule()[schedule().length - 1].end;
  const totalDays = () => daysBetween(start(), summitDate()) + 1;
  const totalWeeks = () => Math.ceil(totalDays() / 7);
  function dayNumber() { return daysBetween(start(), today()) + 1; }
  function currentWeek() { const d = dayNumber(); if (d < 1) return 1; return Math.floor((d - 1) / 7) + 1; }
  function currentModule() { const t = today(); const hit = schedule().find(x => t <= x.end); return modByN(hit ? hit.n : PLAN.modules.length); }
  const modByN = n => PLAN.modules.find(m => m.n === n);
  const modById = id => PLAN.modules.find(m => m.id === id);
  function itemKey(m, i) { return `${m.id}:${i}`; }
  function moduleDone(m) { return m.checklist.filter((_, i) => state.progress.items[itemKey(m, i)]).length; }
  function totals() { let t = 0, d = 0; for (const m of PLAN.modules) { t += m.checklist.length; d += moduleDone(m); } return { t, d, pct: t ? Math.round(100 * d / t) : 0 }; }
  function streak() {
    const days = state.progress.days || {}; let d = today(); let n = 0;
    if (!days[iso(d)]) d = addDays(d, -1);
    while (days[iso(d)]) { n++; d = addDays(d, -1); }
    return n;
  }
  function forecastList() { return Object.values(state.forecasts).sort((a, b) => (a.by || '').localeCompare(b.by || '') || (a.created || '').localeCompare(b.created || '')); }
  function brier() {
    const res = forecastList().filter(f => f.resolved === 'yes' || f.resolved === 'no');
    if (!res.length) return null;
    const s = res.reduce((acc, f) => acc + Math.pow((Number(f.p) || 0) / 100 - (f.resolved === 'yes' ? 1 : 0), 2), 0);
    return { n: res.length, score: s / res.length };
  }
  function digestList() { return Object.values(state.digests).sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))); }
  function nextMonday() { const t = today(); const dow = t.getDay(); const add = dow === 1 ? 7 : ((8 - dow) % 7 || 7); return addDays(t, add); }

  // ───────────────────────── persistence (db with local fallback)
  async function ensureProgressDoc() {
    const ref = state.db.doc('progress/main');
    const snap = await ref.get();
    if (!snap.exists) { await ref.set({ items: state.progress.items || {}, days: state.progress.days || {}, updatedAt: new Date().toISOString() }); }
  }
  async function writeProgress(patch) {
    saveLocal();
    if (!state.db) return;
    try { setStatus('saving…'); await state.db.doc('progress/main').update(Object.assign({ updatedAt: new Date().toISOString() }, patch)); setStatus('synced'); }
    catch (e) { if (e && e.code === 'invalid_argument') { try { await ensureProgressDoc(); await state.db.doc('progress/main').update(patch); setStatus('synced'); return; } catch (e2) { } } setStatus('save failed'); console.warn('progress write failed', e); }
  }
  async function writeDoc(path, data) {
    saveLocal();
    if (!state.db) return;
    try { setStatus('saving…'); await state.db.doc(path).set(data); setStatus('synced'); } catch (e) { setStatus('save failed'); console.warn('write failed', path, e); toast('Could not save to the hub database'); }
  }
  async function deleteDoc(path) {
    saveLocal();
    if (!state.db) return;
    try { await state.db.doc(path).delete(); } catch (e) { console.warn('delete failed', path, e); }
  }
  function applyProgressSnap(snap) {
    if (!snap.exists) return;
    const d = snap.data() || {};
    state.progress.items = Object.assign({}, d.items || {});
    state.progress.days = Object.assign({}, d.days || {});
    state.progress.tasks2 = Object.assign({}, d.tasks2 || {});
    saveLocal(); renderMeter(); rerenderIfView(['today', 'curriculum', 'puzzles', 'progress']);
  }
  function applyCollectionSnap(target, snap, idField) {
    const next = {};
    snap.docs.forEach(doc => { const d = Object.assign({}, doc.data() || {}); d[idField || 'id'] = d[idField || 'id'] || doc.id; next[doc.id] = d; });
    state[target] = next; saveLocal();
  }
  async function initDb() {
    if (!(window.claude && typeof window.claude.use === 'function')) { setStatus('local only'); return; }
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) { setStatus('local only'); return; }
    state.db = db;
    try {
      const pref = db.doc('progress/main');
      const psnap = await pref.get();
      if (psnap.exists) applyProgressSnap(psnap); else await ensureProgressDoc();
      pref.onSnapshot(applyProgressSnap, e => console.warn('progress sub', e));
      const sref = db.doc('settings/main');
      const ssnap = await sref.get();
      if (ssnap.exists) { const sd = ssnap.data(); if (sd.start) state.settings.start = sd.start; if (typeof sd.learnerBrief === 'string') state.settings.learnerBrief = sd.learnerBrief; saveLocal(); }
      sref.onSnapshot(s => { if (!s.exists) return; const sd = s.data(); let changed = false; if (sd.start && sd.start !== state.settings.start) { state.settings.start = sd.start; changed = true; } if (typeof sd.learnerBrief === 'string' && sd.learnerBrief !== state.settings.learnerBrief) { state.settings.learnerBrief = sd.learnerBrief; changed = true; } if (changed) { saveLocal(); renderMeter(); rerenderIfView(['today', 'curriculum', 'guide']); } }, () => { });
      // forecasts: db is the source of truth; migrate local-only ones once
      const fsnap = await db.collection('forecasts').limit(500).get();
      if (fsnap.empty && Object.keys(state.forecasts).length) { for (const f of Object.values(state.forecasts)) { try { await db.doc('forecasts/' + f.id).set(f); } catch (e) { } } }
      db.collection('forecasts').limit(500).onSnapshot(s => { applyCollectionSnap('forecasts', s, 'id'); rerenderIfView(['forecasts', 'curriculum', 'today']); }, e => console.warn('forecast sub', e));
      db.collection('digests').orderBy('date', 'desc').limit(80).onSnapshot(s => { applyCollectionSnap('digests', s, 'date'); rerenderIfView(['digests', 'today']); }, e => console.warn('digest sub', e));
      db.collection('notes').limit(50).onSnapshot(s => { applyCollectionSnap('notes', s, 'id'); }, () => { });
      const hsnap = await db.collection('highlights').limit(500).get();
      if (hsnap.empty && Object.keys(state.highlights).length) { for (const h of Object.values(state.highlights)) { try { await db.doc('highlights/' + h.id).set(h); } catch (e) { } } }
      db.collection('bookmarks').limit(50).onSnapshot(s => { applyCollectionSnap('bookmarks', s, 'module'); const el = document.getElementById('bm-banner'); if (currentView === 'curriculum') markBookmark(); }, e => console.warn('bookmarks sub', e));
      db.collection('highlights').limit(500).onSnapshot(s => { applyCollectionSnap('highlights', s, 'id'); rerenderIfView(['notes']); }, e => console.warn('highlights sub', e));
      state.synced = true; setStatus('synced'); renderMeter();
    } catch (e) { console.warn('db init failed', e); setStatus('local only'); }
  }
  async function initSample() {
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    try { const s = await window.claude.use('sample'); if (s) { state.sample = s; document.body.classList.add('has-sample'); rerenderIfView(['curriculum', 'puzzles']); } } catch (e) { }
  }

  // ───────────────────────── rendering helpers
  function renderMeter() {
    const dn = dayNumber(); const th = totalHours(), dh = doneHours(); const pct = Math.round(100 * dh / th);
    let left;
    if (dn < 1) left = `Starts ${fmtLong(start())} · in ${1 - dn} day${1 - dn === 1 ? '' : 's'}`;
    else if (dn > totalDays()) left = `Day ${dn} · past the summit`;
    else left = `Day ${dn} of ${totalDays()} · Module ${activeModule().n}`;
    $('#meter-left').textContent = left;
    $('#meter-right').textContent = `${pct}% · ${dh.toFixed(1)} of ${th} h · streak ${streak()}`;
    $('#meter-bar').style.width = pct + '%';
  }
  const chip = (t, cls) => `<span class="chip ${cls || ''}">${esc(t)}</span>`;
  function dots(m) { const d = moduleDone(m); return `<span class="dots" title="${d}/${m.checklist.length} done">${m.checklist.map((_, i) => `<i class="${i < d ? 'on' : ''}"></i>`).join('')}</span>`; }
  const altLabel = m => m.altitudeLabel || String(m.altitude);
  const learnerBrief = () => (state.settings.learnerBrief && state.settings.learnerBrief.trim()) || PLAN.learnerBrief || '';
  const streamLabel = m => m.synthesis ? 'Summit' : `Module ${m.n}`;

  // ───────────────────────── views
  // ───────────────────────── tasks, the daily plan and progress tracking
  const parseMin = t => { const s = String(t || ''); const h = s.match(/(\d+(?:\.\d+)?)\s*h/); const m = s.match(/(\d+)\s*min/); return (h ? Math.round(parseFloat(h[1]) * 60) : 0) + (m ? parseInt(m[1], 10) : 0); };
  const TASK_CACHE = {};
  const clip = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };
  function buildTasks(m) {
    if (TASK_CACHE[m.id]) return TASK_CACHE[m.id];
    const T = []; let k = 0; const cap = !!m.synthesis; const MAXC = 40;

    return TRACK.map(v => {
      const olds = (v.deepFrom || []).map(byId).filter(Boolean);
      const cat = k => olds.reduce((a, o) => a.concat(o[k] || []), []);
      const field = olds.length === 0 ? stubField : { teardown: olds[0].field.teardown, applied: cat('field').length ? olds.reduce((a, o) => a.concat(o.field.applied), []) : [], people: olds.reduce((a, o) => a.concat(o.field.people), []).slice(0, 8), impact: olds[0].field.impact };

      return Object.assign({
        altitudeLabel: v.alt, altitude: v.alt, synthesis: !!v.capstone, ready: !!v.frame, deep: olds,
        checklist: v.capstone ? CAP : CHECK,
        concepts: olds.reduce((a, o) => a.concat(o.concepts || []), []).slice(0, 10),
        puzzles: cat('puzzles'), predictions: cat('predictions'), readings: [], field, horizon
      }, v);
    });
  }

        ${(() => { const fw = m.frameworks || []; const anyCore = fw.some(f => f.core); const core = anyCore ? fw.filter(f => f.core) : fw; const more = anyCore ? fw.filter(f => !f.core) : []; const card = f => `<div class="card" style="max-width:80ch;margin-bottom:12px"><div class="eyebrow" style="color:var(--k)">${f.core ? 'Core framework' : 'Framework'}</div><h3 style="margin:4px 0 4px">${esc(f.name)}</h3><div class="small muted" style="margin-bottom:8px">${esc(f.use)}</div><div class="prose small">${md(f.body)}</div></div>`; return core.map(card).join('') + (more.length ? `<details class="digest"><summary><span class="t">More tools (optional)</span><span class="sum">Useful, but you can skip these and still keep up.</span></summary><div class="body">${more.map(card).join('')}</div></details>` : ''); })()}

        <div class="prose">${md(m.exercise.intro)}</div>
        <ul class="applied" style="margin-top:12px">${m.exercise.scenarios.map(sc => `<li>${chip(sc.domain, 'x')} ${esc(sc.prompt)}</li>`).join('')}</ul>

        <p class="prose"><em>${esc(m.prototype.goal)}</em></p>${m.prototype.cost ? `<div class="mono muted" style="margin-bottom:8px">${esc(m.prototype.cost)}</div>` : ''}${buildStepsHtml(m.prototype)}
        <div class="callout"><div class="eyebrow">Deliverable</div><div>${esc(m.prototype.deliverable)}</div></div>
        <div class="callout" style="border-left-color:var(--k)"><div class="eyebrow">Who does what</div><div>${esc(m.prototype.rule)}</div></div>
        <div class="callout" style="border-left-color:var(--x)"><div class="eyebrow">Stretch</div><div>${esc(m.prototype.stretch)}</div></div>
      </section>
      ${(m.readings && m.readings.length) ? `<section class="sect" id="s-readings"><div class="eyebrow">Readings · required ones first, the rest optional</div><h2>Short readings</h2>${readingsHtml(m.readings)}</section>` : ''}`;
    const doc = `
    <article>

        ${m.field.people.length ? `<h4 style="margin:16px 0 6px">Who</h4><ul class="people">${m.field.people.map(p => `<li><b>${esc(p.n)}</b><span>${esc(p.r)}</span></li>`).join('')}</ul>` : ''}
        ${m.field.impact ? `<h4 style="margin:16px 0 6px">Impact</h4><p class="prose">${esc(m.field.impact)}</p>` : ''}
      </section>
      <section class="sect x" id="s-horizon"><div class="eyebrow">The horizon · excitement</div><h2>Where this is going</h2>

        ${m.horizon.who.length ? `<h4 style="margin:12px 0 6px">Who's building it</h4><ul class="people">${m.horizon.who.map(p => `<li><b>${esc(p.n)}</b><span>${esc(p.r)}</span></li>`).join('')}</ul>` : ''}
        ${m.horizon.world ? `<h4 style="margin:16px 0 6px">How it's changing the world</h4><p class="prose">${esc(m.horizon.world)}</p>` : ''}

        <label class="f" style="max-width:76ch;margin-top:10px">Your notes for this module (saved to the hub)<textarea data-action="note" data-mod="${m.id}" placeholder="Ideas, the answer to the ideation prompt, what confused you…">${esc((state.notes[m.id] || {}).text || '')}</textarea></label>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">${m.n > 1 ? `<a class="btn" href="#curriculum/${modByN(m.n - 1).id}">← ${esc(modByN(m.n - 1).title)}</a>` : ''}${m.n < PLAN.modules.length ? `<a class="btn" href="#curriculum/${modByN(m.n + 1).id}">${esc(modByN(m.n + 1).title)} →</a>` : ''}</div>

  function exampleHtml(ex, i) {

  function puzzleHtml(m, p, i) {

  function forecastSuggestHtml(m, p, i) {

    return `<div class="forecast"><div><div class="q">${esc(p.q)}</div><div class="meta"><span>${esc(p.kind)}</span><span>resolve by ${esc(p.by)}</span><span>${esc(p.source || '')}</span></div></div><div class="ctl"><input type="number" min="1" max="99" value="50" id="p-${id}" aria-label="probability percent"><span class="mono muted">%</span><button class="btn small primary" data-action="log-forecast" data-mod="${m.id}" data-i="${i}" data-id="${id}">Log</button></div></div>`;

  function viewForecasts() {
    const list = forecastList(); const b = brier(); const open = list.filter(f => !f.resolved); const res = list.filter(f => f.resolved);
    const row = f => {
      const overdue = !f.resolved && f.by && parse(f.by) < today();
      return `<div class="forecast" id="fc-${esc(f.id)}"><div><div class="q">${esc(f.q)}</div><div class="meta"><span>${esc(f.kind || '')}</span><span>${f.module ? 'module ' + esc(f.module) : 'custom'}</span><span>by ${esc(f.by || '—')}${overdue ? ' · <b style="color:var(--warn)">due</b>' : ''}</span>${f.source ? `<span>${esc(f.source)}</span>` : ''}${f.resolved ? `<span>brier ${(Math.pow((Number(f.p) || 0) / 100 - (f.resolved === 'yes' ? 1 : 0), 2)).toFixed(3)}</span>` : ''}</div>${f.note ? `<div class="small muted" style="margin-top:4px">${esc(f.note)}</div>` : ''}</div>
        <div class="ctl">${f.resolved ? `<span class="p num">${esc(f.p)}%</span><span class="res ${f.resolved}">${f.resolved === 'yes' ? 'happened' : "didn't"}</span><button class="btn small" data-action="unresolve" data-id="${esc(f.id)}">reopen</button>` : `<input type="number" min="1" max="99" value="${esc(f.p)}" data-action="edit-p" data-id="${esc(f.id)}" aria-label="probability"><span class="mono muted">%</span><button class="btn small" data-action="resolve" data-id="${esc(f.id)}" data-v="yes">Happened</button><button class="btn small" data-action="resolve" data-id="${esc(f.id)}" data-v="no">Didn't</button><button class="btn small" data-action="delete-forecast" data-id="${esc(f.id)}" title="delete">✕</button>`}</div></div>`;
    };
    return `
    <div class="grid three" style="margin-bottom:20px">
      <div class="card"><div class="stat"><span class="v num">${list.length}</span><span class="l">forecasts logged</span></div></div>
      <div class="card"><div class="stat"><span class="v num">${res.length}</span><span class="l">resolved</span></div></div>
      <div class="card"><div class="stat"><span class="v num">${b ? b.score.toFixed(3) : '—'}</span><span class="l">Brier score · coin flip = 0.250</span></div></div>
    </div>
    <div class="grid two" style="align-items:start">
      <div>
        <h2 style="margin-bottom:10px">Open <span class="muted" style="font-weight:500">(${open.length})</span></h2>
        ${open.length ? open.map(row).join('') : `<div class="empty">Nothing logged yet. Each module suggests two — or add your own on the right.</div>`}
        ${res.length ? `<h2 style="margin:22px 0 10px">Resolved <span class="muted" style="font-weight:500">(${res.length})</span></h2>${res.map(row).join('')}` : ''}
      </div>
      <div class="card">
        <div class="eyebrow">Add a forecast</div>
        <div style="display:grid;gap:10px;margin-top:10px">
          <label class="f">Question (binary, with a clear resolution)<textarea id="nf-q" placeholder="By Jun 30, 2027, will …?"></textarea></label>
          <div class="grid two"><label class="f">Probability (%)<input type="number" id="nf-p" min="1" max="99" value="50"></label><label class="f">Resolve by<input type="date" id="nf-by" value="${iso(addDays(today(), 365))}"></label></div>
          <label class="f">How it resolves (source)<input type="text" id="nf-src" placeholder="e.g. LMArena leaderboard; RBI press release"></label>
          <div><button class="btn primary" data-action="add-forecast">Log forecast</button></div>
        </div>
        <div class="muted small" style="margin-top:14px">Brier = mean of (p − outcome)². Lower is better; 0.25 is what always saying 50% scores; superforecasters land near 0.15–0.20 on hard questions.</div>
      </div>
    </div>`;
  }

  function viewGuide() {

        <section class="card"><div class="eyebrow">The tutor · /ai-tutor</div><div class="prose small" style="margin-top:8px"><p>A saved skill you can run in any Claude session. It reads your progress from this hub, then runs one unit Socratically. Try:</p><ul><li><b>/ai-tutor</b> — pick up where you are (the current module's next unit).</li><li><b>/ai-tutor quiz</b> — five questions on this week's module; failing is information.</li><li><b>/ai-tutor exercise</b> — run the module's scenario exercise: it questions you, you decide.</li><li><b>/ai-tutor build</b> — design the prototype together before Claude Code builds it.</li><li><b>/ai-tutor explain &lt;idea&gt;</b> — first principles up, with a worked example.</li><li><b>/ai-tutor review</b> — spaced repetition over earlier modules.</li><li><b>/ai-tutor forecast</b> — discuss and log predictions; resolve due ones.</li></ul><p>It writes progress back here, so the checkboxes and streak update live.</p></div></section>

  function diagramsHtml(m) {
    const keys = (DG_MAP[m.id] || []).filter(k => DIAGRAMS[k]); if (!keys.length) return '';
    return `<div class="diagrams">${keys.map(k => { const d = DIAGRAMS[k]; return `<figure class="diagram" data-dg="${k}">${d.title ? `<div class="dg-title">${esc(d.title)}</div>` : ''}<div class="dg-body">${d.html || d.svg || ''}</div>${d.caption ? `<figcaption>${esc(d.caption)}</figcaption>` : ''}</figure>`; }).join('')}</div>`;
  }
  function initDiagrams() {
    document.querySelectorAll('figure.diagram[data-dg]').forEach(f => { const d = DIAGRAMS[f.dataset.dg]; if (d && typeof d.init === 'function') { try { d.init(f.querySelector('.dg-body')); } catch (e) { console.warn('diagram init failed', f.dataset.dg, e); } } });
  }

  // ───────────────────────── router
  let currentView = 'today';
  function route() {
    const h = (location.hash || '#today').slice(1); const [view, arg] = h.split('/');
    const views = { today: viewToday, curriculum: () => viewCurriculum(arg), digests: viewDigests, forecasts: viewForecasts, puzzles: viewPuzzles, guide: viewGuide, notes: viewNotes, progress: viewProgress };
    const fn = views[view] || viewToday; currentView = views[view] ? view : 'today';
    document.querySelectorAll('nav.tabs a').forEach(a => { if (a.dataset.view === currentView) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    main.innerHTML = fn();
    if (pendingScroll) { const el = document.getElementById('s-' + pendingScroll); pendingScroll = null; if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30); }
    else if (currentView !== 'curriculum' || !arg) window.scrollTo({ top: 0 });
    renderMeter();
    afterRender(arg);
  }
  let pendingScroll = null;
  function rerenderIfView(list) { if (list.includes(currentView)) { const y = window.scrollY; route(); window.scrollTo({ top: y }); } }
  window.addEventListener('hashchange', route);

  // ───────────────────────── events
  main.addEventListener('click', async e => {
    const scroll = e.target.closest('[data-scroll]');
    if (scroll) { pendingScroll = scroll.dataset.scroll; const href = scroll.getAttribute('href'); if (href === location.hash) { const el = document.getElementById('s-' + pendingScroll); pendingScroll = null; if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); e.preventDefault(); } return; }
    const el = e.target.closest('[data-action]'); if (!el) return;
    const a = el.dataset.action;
    if (a === 'mark-day') {
      const k = iso(today()); const on = !state.progress.days[k]; state.progress.days[k] = on;
      if (!on) delete state.progress.days[k];
      await writeProgress({ days: { [k]: on } }); renderMeter(); rerenderIfView(['today']); toast(on ? 'Counted. Keep the chain.' : 'Unmarked.');
    }
    if (a === 'reveal') { const t = document.getElementById(el.dataset.target); if (t) t.hidden = !t.hidden; }
    if (a === 'check-toggle') { const t = document.getElementById(el.dataset.target); if (t) t.hidden = !t.hidden; }
    if (a === 'check-run') { await runCheck(el.dataset.mod, Number(el.dataset.i), el.dataset.target, el); }
    if (a === 'check-reply') { await runReply(el.dataset.mod, Number(el.dataset.i), el.dataset.target, el); }
    if (a === 'deeper') { await runDeeper(el.dataset.mod, el); }
    if (a === 'log-forecast') {
      const m = modById(el.dataset.mod); const p = m.predictions[Number(el.dataset.i)]; const inp = document.getElementById('p-' + el.dataset.id); const pv = Math.min(99, Math.max(1, Number(inp && inp.value) || 50));
      const f = { id: el.dataset.id, q: p.q, p: pv, by: p.by, kind: p.kind, source: p.source || '', module: m.n, created: new Date().toISOString(), resolved: null };
      state.forecasts[f.id] = f; await writeDoc('forecasts/' + f.id, f); toast('Forecast logged'); rerenderIfView(['curriculum']);
    }
    if (a === 'add-forecast') {
      const q = ($('#nf-q').value || '').trim(); if (!q) { toast('Write the question first'); return; }
      const f = { id: uid(), q, p: Math.min(99, Math.max(1, Number($('#nf-p').value) || 50)), by: $('#nf-by').value || '', kind: 'custom', source: ($('#nf-src').value || '').trim(), module: null, created: new Date().toISOString(), resolved: null };
      state.forecasts[f.id] = f; await writeDoc('forecasts/' + f.id, f); toast('Forecast logged'); rerenderIfView(['forecasts']);
    }
    if (a === 'resolve') { const f = state.forecasts[el.dataset.id]; if (!f) return; f.resolved = el.dataset.v; f.resolvedAt = new Date().toISOString(); await writeDoc('forecasts/' + f.id, f); toast(el.dataset.v === 'yes' ? 'Resolved: happened' : "Resolved: didn't happen"); rerenderIfView(['forecasts']); }
    if (a === 'unresolve') { const f = state.forecasts[el.dataset.id]; if (!f) return; f.resolved = null; delete f.resolvedAt; await writeDoc('forecasts/' + f.id, f); rerenderIfView(['forecasts']); }
    if (a === 'delete-forecast') { const f = state.forecasts[el.dataset.id]; if (!f) return; delete state.forecasts[el.dataset.id]; await deleteDoc('forecasts/' + f.id); toast('Deleted'); rerenderIfView(['forecasts']); }
    if (a === 'save-brief') { const v = ($('#set-brief').value || '').trim(); state.settings.learnerBrief = v; saveLocal(); if (state.db) { try { setStatus('saving…'); await state.db.doc('settings/main').update({ learnerBrief: v, updatedAt: new Date().toISOString() }); setStatus('synced'); } catch (e) { try { await state.db.doc('settings/main').set({ start: state.settings.start || PLAN.start, learnerBrief: v, updatedAt: new Date().toISOString() }); setStatus('synced'); } catch (e2) { setStatus('save failed'); } } } toast('Instructions saved'); }
    if (a === 'save-start') { const v = $('#set-start').value; if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast('Pick a date'); return; } state.settings.start = v; await writeDoc('settings/main', { start: v, updatedAt: new Date().toISOString() }); toast('Start date saved'); route(); }
    if (a === 'export') { const data = JSON.stringify({ progress: state.progress, forecasts: state.forecasts, notes: state.notes, settings: state.settings }, null, 2); try { await navigator.clipboard.writeText(data); toast('Copied to clipboard'); } catch (err) { const ta = document.createElement('textarea'); ta.value = data; ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e2) { toast('Select and copy from the console'); console.log(data); } ta.remove(); } }
  });
  main.addEventListener('change', async e => {
    const el = e.target.closest('[data-action]'); if (!el) return;
    if (el.dataset.action === 'toggle-item') {
      const m = modById(el.dataset.mod); const k = itemKey(m, Number(el.dataset.i)); const on = el.checked;
      state.progress.items[k] = on; if (!on) delete state.progress.items[k];
      const label = el.closest('.check'); if (label) label.classList.toggle('on', on);
      await writeProgress({ items: { [k]: on } }); renderMeter();
      document.querySelectorAll(`input[data-action="toggle-item"][data-mod="${m.id}"][data-i="${el.dataset.i}"]`).forEach(x => { x.checked = on; const l = x.closest('.check'); if (l) l.classList.toggle('on', on); });
      if (on && moduleDone(m) === m.checklist.length) toast(`${streamLabel(m)} complete — altitude ${altLabel(m)} ✓`);
      const rail = document.querySelector(`.rail a[href="#curriculum/${m.id}"] .w`); if (rail) rail.innerHTML = `${esc(modRange(m.n))} ${dots(m)}${m.n === currentModule().n ? ' · now' : ''}`;
    }
    if (el.dataset.action === 'edit-p') { const f = state.forecasts[el.dataset.id]; if (!f) return; f.p = Math.min(99, Math.max(1, Number(el.value) || f.p)); el.value = f.p; await writeDoc('forecasts/' + f.id, f); toast('Probability updated'); }
  });
  let noteT;
  main.addEventListener('input', e => {
    const el = e.target.closest('textarea[data-action="note"]'); if (!el) return;
    const mid = el.dataset.mod; state.notes[mid] = { id: mid, text: el.value, updatedAt: new Date().toISOString() }; saveLocal();
    clearTimeout(noteT); noteT = setTimeout(() => writeDoc('notes/' + mid, state.notes[mid]), 900);
  });

  // ───────────────────────── sample (in-page tutor)
  const sampleCopy = code => ({ not_granted: 'Claude access was declined for this page.', rate_limited: 'Too many requests right now — try again in a minute.', refused: 'Claude declined this one; rephrase and try again.', upstream_error: 'Connection hiccup — try again.', session_expired: 'Please sign in again.' }[code] || 'Something went wrong; try again.');
  // Each puzzle keeps a short conversation: learner answer → tutor verdict → (follow-up question) → learner reply → …
  const threads = {};
  const hasFollowUp = t => { const tail = String(t || '').trim().slice(-400); return /\?/.test(tail) && !/no further question/i.test(tail); };
  function tutorTurn(out, text) { const d = document.createElement('div'); d.className = 'verdict'; d.textContent = text; out.appendChild(d); return d; }
  function addReplyBox(out, mid, i, pid) {
    const n = out.querySelectorAll('.followup').length;
    const w = document.createElement('div'); w.className = 'followup';
    w.innerHTML = `<span class="eyebrow">Your answer to the follow-up</span><textarea id="chk-fu-${pid}-${n}" placeholder="Answer the follow-up question above…"></textarea><div class="row"><button class="btn small primary" data-action="check-reply" data-mod="${esc(mid)}" data-i="${i}" data-target="${pid}" data-box="chk-fu-${pid}-${n}">Reply</button></div>`;
    out.appendChild(w);
  }
  async function askTutor(prompt, out, btn) {
    const d = tutorTurn(out, 'Thinking…'); btn.disabled = true;
    try { const { text } = await state.sample(prompt, { onText: ({ text }) => { d.textContent = text; } }); d.textContent = text; return text; }
    catch (e) { d.textContent = (e && e.text) ? e.text : sampleCopy(e && e.code); return null; }
    finally { btn.disabled = false; }
  }
  async function runCheck(mid, i, pid, btn) {
    const m = modById(mid); const p = m.puzzles[i]; const inp = document.getElementById('chk-in-' + pid); const out = document.getElementById('chk-out-' + pid);
    const ans = (inp.value || '').trim(); if (!ans) { toast('Write your reasoning first'); return; }
    if (!state.sample) { toast('Claude is not available in this view'); return; }
    out.hidden = false; out.innerHTML = ''; threads[pid] = [{ who: 'Learner', text: ans }];
    const prompt = `You are grading a learner's answer to a puzzle in a first-principles AI curriculum. Be rigorous, warm and brief. The learner's standing instructions about how they learn: ${learnerBrief()}\n\nPUZZLE: ${p.q}\nHINT: ${p.hint}\nREFERENCE ANSWER: ${p.a}\n\nLEARNER'S ANSWER:\n${ans}\n\nReply in at most 180 words with: (1) a verdict — Correct / Mostly right / Off track; (2) what's right; (3) the specific gap or error, if any, explained from first principles (not by restating the reference); (4) one follow-up question that would deepen understanding, as the final line. Plain text, no markdown headings.`;
    const text = await askTutor(prompt, out, btn);
    if (text) { threads[pid].push({ who: 'Tutor', text }); if (hasFollowUp(text)) addReplyBox(out, mid, i, pid); }
  }
  async function runReply(mid, i, pid, btn) {
    const m = modById(mid); const p = m.puzzles[i]; const out = document.getElementById('chk-out-' + pid); const box = document.getElementById(btn.dataset.box);
    const ans = (box && box.value || '').trim(); if (!ans) { toast('Write your answer first'); return; }
    if (!state.sample) { toast('Claude is not available in this view'); return; }
    const wrap = box.closest('.followup'); const mine = document.createElement('div'); mine.className = 'mine'; mine.textContent = ans; wrap.replaceWith(mine);
    const thread = threads[pid] || (threads[pid] = []); thread.push({ who: 'Learner', text: ans });
    const transcript = thread.map(t => `${t.who.toUpperCase()}:\n${t.text}`).join('\n\n');
    const prompt = `You are a tutor in a first-principles AI curriculum, continuing a conversation about one puzzle. Be rigorous, warm and brief. The learner's standing instructions about how they learn: ${learnerBrief()}\n\nPUZZLE: ${p.q}\nHINT: ${p.hint}\nREFERENCE ANSWER: ${p.a}\n\nCONVERSATION SO FAR:\n${transcript}\n\nThe learner has just answered your last follow-up question. Reply in at most 150 words: say whether their answer is right, what's right, and close any gap from first principles. If there is still something worth probing, end with exactly one new follow-up question as the final line; if their understanding is now solid, end with the line "No further question — nicely done." Plain text, no markdown headings.`;
    const text = await askTutor(prompt, out, btn);
    if (text) { thread.push({ who: 'Tutor', text }); if (hasFollowUp(text)) addReplyBox(out, mid, i, pid); }
    else { thread.pop(); addReplyBox(out, mid, i, pid); }
  }
  async function runDeeper(mid, btn) {
    const m = modById(mid); const out = document.getElementById('deeper-out'); if (!out || !state.sample) return;
    out.hidden = false; out.textContent = 'Thinking…'; btn.disabled = true;
    const prompt = `A learner who loves solving problems but has limited background in advanced mathematics and deep learning is studying this section of a first-principles AI curriculum (module: "${m.title}"). Their standing instructions: ${learnerBrief()}\n\nIdentify the single hardest idea in the section. First say in two sentences why it matters (what we are trying to achieve). Then explain it from the basics upward — start from something they already know, define every term on first use, build the idea with one small worked numerical example showing how the input and output change, describe a picture they could draw, and finish with one question that checks understanding. Under 450 words, plain text, no headings.\n\nSECTION:\n${(m.frame || (m.deep[0] && m.deep[0].how) || '').slice(0, 6000)}`;
    try { const { text } = await state.sample(prompt, { onText: ({ text }) => { out.textContent = text; } }); out.textContent = text; }
    catch (e) { out.textContent = (e && e.text) ? e.text : sampleCopy(e && e.code); }
    finally { btn.disabled = false; }
  }

  // ───────────────────────── boot
  if (typeof EXTRA !== 'undefined') { for (const m of PLAN.modules) { const x = EXTRA[m.id]; if (x) { if (x.plain) m.plain = x.plain; if (x.examples) m.examples = x.examples; } } }
  PLAN.modules = buildModules(PLAN.modules);
  if (PLAN.name) { document.title = PLAN.name; $('.brand .name').textContent = PLAN.name; }
  if (PLAN.subtitle) $('#mast-sub').textContent = PLAN.subtitle;
  loadLocal();
  route();
  initDb();
  initSample();
})();

</script>

</body></html>
